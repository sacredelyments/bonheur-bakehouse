<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cakeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2339"/>
      <stop offset="100%" stop-color="#2a1627"/>
    </linearGradient>
    <linearGradient id="cherry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea7a5c"/>
      <stop offset="100%" stop-color="#d86343"/>
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect width="64" height="64" rx="18" fill="url(#cakeBg)"/>
  
  <!-- Cake slice illustration -->
  <g transform="translate(12, 12)" stroke="#f8f2e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Cake body outline -->
    <path d="M4 29 L36 29 L32 15 L4 21 Z" fill="#fff9f0" fill-opacity="0.15"/>
    <path d="M4 21 L20 9 L32 15 L4 21 Z" fill="#f6d68f" fill-opacity="0.3"/>
    <path d="M4 29 L4 21"/>
    <path d="M36 29 L32 15"/>
    <!-- Frosting layers -->
    <path d="M4 25 C10 24 16 26 22 25 C27 24 32 25 36 25" stroke="#d86343" stroke-width="1.8"/>
    <!-- Cherry on top -->
    <circle cx="20" cy="7" r="3.5" fill="url(#cherry)" stroke="#d86343" stroke-width="1.2"/>
    <path d="M22 4 C24 1 27 2 28 3" stroke="#b9c6a1" stroke-width="1.5"/>
  </g>
</svg>
